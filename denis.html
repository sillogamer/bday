<body>

</div>

            </div>
        </section>
    
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const prompt = document.querySelector('.scroll-prompt');
                if (!prompt) return;
                const hide = () => { prompt.style.transition = 'opacity 200ms'; prompt.style.opacity = '0'; setTimeout(() => { prompt.style.display = 'none'; }, 250); window.removeEventListener('scroll', onScroll); };
                const onScroll = () => { if (window.scrollY > 50) hide(); };
                window.addEventListener('scroll', onScroll, { passive: true });
                prompt.addEventListener('click', function () { setTimeout(hide, 150); });
            });
        </script>
</body>
